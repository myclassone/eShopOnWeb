name: Trigger auto deployment for mytestctappone

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/mytestctappone-AutoDeployTrigger-48f9200c-5af7-4356-9656-5410b6702f80.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MYTESTCTAPPONE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYTESTCTAPPONE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYTESTCTAPPONE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: testimg025.azurecr.io
          registryUsername: ${{ secrets.MYTESTCTAPPONE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYTESTCTAPPONE_REGISTRY_PASSWORD }}
          containerAppName: mytestctappone
          resourceGroup: mytestrg
          imageToBuild: testimg025.azurecr.io/mytestctappone:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


